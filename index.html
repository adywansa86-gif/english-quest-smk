 {title:"Meja Keuangan",en:"The Finance Desk",brief:"Supervisor keuangan meminta barang dan memberi instruksi singkat.",items:[

 {title:"SOP Pencatatan",en:"Recording Procedures",brief:"Ikuti prosedur pencatatan kas dan pembuatan faktur dengan urutan yang benar.",items:[

 {title:"Perlengkapan Tur",en:"Tour Kit",brief:"Ketua tim tur meminta perlengkapan dan memberi pengumuman singkat.",items:[

 {title:"SOP Pemandu",en:"Guide Procedures",brief:"Ikuti prosedur menyambut rombongan dan check-in tamu hotel.",items:[

  P("Pack the product in a box.","Kemas produknya dalam kotak.",[["📦","box"],["🛒","cart"],["🏷️","price tag"]],"Pack = kemas. Box = kotak."),
  L("This product is on sale.",["Produk ini sedang diskon.","Produk ini sudah habis.","Produk ini rusak."],"On sale = sedang diskon."),
  L("Buy one, get one free.",["Beli satu, gratis satu.","Beli satu, bayar dua.","Satu untuk semua."],"Get … free = dapat gratis."),
  M("Our customers are mostly teenagers.",["Pelanggan kami kebanyakan remaja.","Pelanggan kami sedikit sekali.","Kami tidak punya pelanggan remaja."],"Mostly = kebanyakan.")]},
 {title:"Langkah Promosi",en:"Promotion Steps",brief:"Ikuti langkah promosi produk di media sosial dan proses pesanan online.",items:[
  O("SOP: Posting a product on social media",["First, take a clear photo of the product.","Then, write a short and catchy caption.","After that, add the price and hashtags.","Finally, post it and reply to comments."],ORD),
  A("Tulis keterangan yang singkat dan menarik.","Write a short and catchy caption.","Catchy = menarik perhatian."),
  C("Selling tip","Always ___ at the customer and say hello.",["smile","sleep","shout"],"Penjual yang baik selalu tersenyum.","Selalu tersenyum kepada pelanggan dan sapa mereka."),
  M("Free delivery for orders above 100,000 rupiah.",["Gratis ongkir untuk pesanan di atas 100.000 rupiah.","Ongkir 100.000 rupiah untuk semua pesanan.","Pesanan di bawah 100.000 rupiah gratis."],"Above = di atas. Free delivery = gratis ongkir."),
  O("SOP: Handling an online order",["First, confirm the order with the customer.","Then, check the stock in the warehouse.","Next, pack the product carefully.","Finally, send the tracking number to the customer."],ORD),
  C("Marketing plan","___, we choose our target market. Then, we make the content.",["First","Finally","Yesterday"],"Langkah pertama: First.","Pertama, kita menentukan target pasar."),
  A("Periksa stok sebelum kamu menerima pesanan.","Check the stock before you accept an order.","Before = sebelum."),
  C("Supervisor's advice","You had better ___ to every message quickly.",["reply","replied","replying"],HB,"Sebaiknya kamu membalas setiap pesan dengan cepat.")]},
 {title:"Melayani Pembeli",en:"Serving Buyers",brief:"Jawab pertanyaan pembeli, deskripsikan produk, dan ceritakan hasil penjualan.",items:[
  D("Customer","Is this bag available in black?","Apakah tas ini ada yang warna hitam?",["Yes, it is. We have it in black and brown.","Bags are useful.","No. Go away."],"Jawab pertanyaan, lalu beri pilihan."),
  D("Customer","It's too expensive for me.","Ini terlalu mahal untuk saya.",["I understand. This one is cheaper, and the quality is still good.","Then don't buy it.","Everything is expensive."],"Tawarkan alternatif dengan sopan."),
  T("Describing a product","This phone case is ___ (strong) than the old model.",["stronger"],"Kata sifat pendek + -er + than.","Casing HP ini lebih kuat daripada model lama."),
  T("Describing a product","It is the ___ (popular) snack in our shop.",["most popular"],"Superlatif kata sifat panjang: the most + adjective.","Ini camilan paling laris di toko kami."),
  E("Last month our shop sell 300 bottles of coconut oil.","sell","sold",PAST),
  L("Our new coffee is made from local beans.",["Kopi baru kami dibuat dari biji kopi lokal.","Kopi baru kami diimpor dari luar negeri.","Kopi baru kami belum dijual."],"Local beans = biji kopi lokal."),
  D("Customer","The product I received is broken.","Produk yang saya terima rusak.",["I'm sorry to hear that. Could you send us a photo? We will replace it.","That's not our problem.","Please buy another one."],"Minta maaf, minta bukti, tawarkan penggantian."),
  E("Yesterday many customers visits our booth at the bazaar.","visits","visited",PAST)]},
 {title:"Rencana Pemasaran",en:"Marketing Plan",brief:"Tulis laporan penjualan dan yakinkan manajer dengan rencana pemasaranmu.",items:[
  C("SALES REPORT: September","Sales increased by 30% ___ we started using short videos.",["after","before","unless"],"After = setelah. Penjualan naik setelah memakai video pendek."),
  T("SALES REPORT","Online sales were higher ___ offline sales.",["than"],"Perbandingan: higher … than."),
  C("Recommendation","I suggest ___ a discount for students on weekends.",["giving","give","gave"],"Suggest + verb-ing."),
  C("Target market","Our customers are young people ___ like healthy snacks.",["who","which","where"],"Adjective clause untuk orang: who."),
  E("The customer told me that she want a refund.","want","wanted",REP),
  A("Kita sebaiknya bekerja sama dengan influencer lokal.","We should work with local influencers.","Should = sebaiknya (memberi saran)."),
  D("Manager","Why should we use social media instead of posters?","Kenapa kita harus pakai media sosial, bukan poster?",["Most of our customers are online every day, and social media costs less to reach them.","Because posters are ugly.","I don't know."],"Argumen yang kuat memakai fakta dan alasan."),
  T("Indirect speech","Direct: 'I love this product.' → The customer said that she ___ the product.",["loved"],REP)]}
 ]},
{key:"mplb",title:"Office Heroes",dept:"Manajemen Perkantoran & Layanan Bisnis",ico:"🗂️",place:"Kantor & front office",
 intro:"Kamu staf administrasi. Kenali perlengkapan kantor, ikuti SOP administrasi, layani tamu dan telepon, lalu tulis email resmi dan notulen.",
 missions:[
 {title:"Resepsionis Baru",en:"The New Receptionist",brief:"Sapa tamu, catat nomor telepon dan jadwal, tunjukkan letak benda.",items:[
  D("Visitor","Good afternoon. Is this the front office?","Selamat siang. Apakah ini front office?",["Good afternoon. Yes, it is. How can I help you?","Good night.","I'm an office."],"Balas salam yang sama, jawab pertanyaan, tawarkan bantuan."),
  X("Tulis nomor yang kamu dengar.","zero eight one two",["0812"],"Zero = 0, eight = 8, one = 1, two = 2."),
  L("The meeting is on Tuesday at two o'clock.",["Rapatnya hari Selasa pukul dua.","Rapatnya hari Kamis pukul dua.","Rapatnya hari Selasa pukul sepuluh."],"Tuesday = Selasa. Thursday = Kamis."),
  C("Office directory","The director's office is on the ___ floor.",["second","two","twice"],"Lantai memakai bilangan bertingkat: first, second, third.","Ruang direktur ada di lantai dua."),
  C("Daily routine","Ms. Rina ___ the letters every morning.",["types","type","typing"],SP,"Bu Rina mengetik surat setiap pagi."),
  M("The printer is between the window and the door.",["Printernya ada di antara jendela dan pintu.","Printernya ada di depan jendela.","Printernya ada di dekat lemari."],"Between = di antara."),
  X("Tulis nama bulan yang kamu dengar.","September",["september"],"September. Ejaan: S-E-P-T-E-M-B-E-R."),
  C("On the phone","Could you ___ your name, please?",["spell","spill","speak"],"Spell = mengeja.","Bisakah Anda mengeja nama Anda?")]},
 {title:"Pekan Sibuk",en:"A Busy Week",brief:"Ceritakan pekerjaan yang sudah selesai dan tanggapi permintaan rekan kerja.",items:[
  C("Yesterday","Yesterday I ___ twenty letters.",["sent","send","sends"],"Send adalah kata kerja tidak beraturan: send → sent.","Kemarin saya mengirim dua puluh surat."),
  C("Last Friday","The manager ___ come to the office last Friday.",["didn't","doesn't","wasn't"],DN,"Manajer tidak datang ke kantor Jumat lalu."),
  D("Boss","Did you call the hotel?","Apakah kamu sudah menelepon hotel?",["Yes, I did. The room is booked.","Yes, I do.","No, I am."],DQ),
  D("Colleague","Can you make copies of this document?","Bisakah kamu memfotokopi dokumen ini?",["Sure. How many copies do you need?","No, I can't swim.","It's a document."],"Jawab bisa, lalu tanyakan detailnya."),
  M("I think we should start the meeting now.",["Menurut saya kita sebaiknya mulai rapat sekarang.","Rapatnya sudah selesai.","Saya tidak ikut rapat."],"Should = sebaiknya."),
  C("Feelings","I was ___ because the printer stopped during the meeting.",["nervous","noisy","new"],"Nervous = gugup.","Saya gugup karena printernya mati saat rapat."),
  T("Welcoming guests","When the guests ___ (arrive), I gave them the agenda.",["arrived"],"When + kejadian lampau: arrive → arrived.","Ketika para tamu tiba, saya memberi mereka agenda."),
  C("Phone manners","Please answer the phone ___.",["politely","polite","police"],"Adverb (kata keterangan cara) biasanya berakhiran -ly.","Tolong angkat telepon dengan sopan.")]},
 {title:"Meja Kantor",en:"The Office Desk",brief:"Kepala bagian meminta perlengkapan kantor dan memberi informasi singkat.",items:[
  P("Pass me the paper clip.","Berikan klip kertasnya.",[["📎","paper clip"],["📌","pin"],["✂️","scissors"]],"A paper clip holds papers together."),
  P("Put the letter in the envelope.","Masukkan surat ke amplop.",[["✉️","envelope"],["📁","folder"],["📅","calendar"]],"An envelope is for sending letters. (Amplop.)"),
  P("Please answer the phone.","Tolong angkat teleponnya.",[["☎️","phone"],["🖨️","printer"],["💻","laptop"]],"Answer the phone = mengangkat telepon."),
  P("Check the calendar.","Periksa kalendernya.",[["📅","calendar"],["📎","paper clip"],["✉️","envelope"]],"A calendar shows dates and schedules."),
  P("File the documents in the folder.","Simpan dokumen di map.",[["📁","folder"],["✂️","scissors"],["☎️","phone"]],"File (verb) = mengarsipkan/menyimpan dokumen."),
  L("The meeting starts at ten.",["Rapat dimulai pukul sepuluh.","Rapat selesai pukul sepuluh.","Rapatnya dibatalkan."],"Start = mulai."),
  L("Please make five copies of this letter.",["Tolong buat lima salinan surat ini.","Tolong kirim lima surat ini.","Tolong baca surat ini lima kali."],"Copies = salinan/fotokopi."),
  M("Mr. Hasan is out of the office today.",["Pak Hasan tidak di kantor hari ini.","Pak Hasan lembur hari ini.","Pak Hasan pindah kantor hari ini."],"Out of the office = sedang tidak di kantor.")]},
 {title:"SOP Administrasi",en:"Office Procedures",brief:"Ikuti prosedur menerima telepon dan menyiapkan ruang rapat.",items:[
  O("SOP: Receiving a phone call",["First, answer the phone and say the company name.","Then, ask for the caller's name.","Next, write down the message.","Finally, give the message to the right person."],ORD),
  A("Mohon tunggu sebentar.","Please hold on a moment.","Hold on = menunggu (di telepon)."),
  C("Filing rule","Put the files in ___ order, from A to Z.",["alphabetical","delicious","noisy"],"Urutan A sampai Z = alphabetical.","Susun berkas sesuai abjad, dari A sampai Z."),
  O("SOP: Preparing a meeting room",["First, book the room for the right time.","Then, arrange the chairs and the table.","After that, set up the projector.","Finally, put water and the agenda on the table."],ORD),
  M("Please sign the attendance list.",["Mohon tanda tangani daftar hadir.","Mohon baca daftar menu.","Mohon kirim surat lamaran."],"Attendance list = daftar hadir."),
  C("Email rule","Always write a clear ___ line in your email.",["subject","object","kitchen"],"Subject line = perihal/judul email.","Selalu tulis perihal email yang jelas."),
  A("Simpan dokumen penting di lemari arsip.","Keep important documents in the filing cabinet.","Filing cabinet = lemari arsip."),
  C("Supervisor's advice","You had better ___ the email before you send it.",["check","checked","checking"],HB,"Sebaiknya kamu memeriksa email sebelum mengirimnya.")]},
 {title:"Front Office",en:"Front Office",brief:"Sambut tamu, terima telepon, catat pesan, dan deskripsikan kantor.",items:[
  D("Visitor","Good morning. I have an appointment with Ms. Rina.","Selamat pagi. Saya ada janji dengan Bu Rina.",["Good morning. May I have your name, please?","She is busy. Go home.","Appointments are boring."],"Sapa tamu dan tanyakan namanya dengan sopan."),
  D("Caller","Can I speak to the manager?","Bisa bicara dengan manajer?",["I'm sorry, he is in a meeting. May I take a message?","No.","Who are you? Why?"],"Jika orangnya tidak ada, tawarkan untuk mencatat pesan."),
  T("Taking a message","Mr. Budi ___ (call) at 10 a.m. this morning.",["called"],"Kejadian yang sudah terjadi pagi tadi memakai past tense: called.","Pak Budi menelepon pukul 10 pagi tadi."),
  E("Yesterday the director sign all the letters.","sign","signed",PAST),
  L("Could you send the agenda to all participants by email?",["Bisakah kamu mengirim agenda ke semua peserta lewat email?","Bisakah kamu mencetak agenda untuk direktur?","Bisakah kamu membatalkan rapat?"],"Send … by email = kirim lewat email."),
  T("Describing the office","Our new meeting room is ___ (big) than the old one.",["bigger"],"big → bigger (huruf g digandakan).","Ruang rapat baru kami lebih besar dari yang lama."),
  D("Visitor","Where is the finance department?","Di mana bagian keuangan?",["It's on the second floor, next to the elevator.","It's finance.","I don't work here."],"Beri petunjuk arah yang jelas."),
  E("While I was typing the report, the printer stop working.","stop","stopped","Past progressive (was typing) + past simple (stopped).")]},
 {title:"Surat & Notulen",en:"Letters & Minutes",brief:"Tulis email resmi dan notulen rapat, lalu beri saran kepada direktur.",items:[
  C("FORMAL EMAIL","Dear Mr. Lee, I am writing to ___ our meeting on Monday.",["confirm","eat","shout"],"Confirm = mengonfirmasi."),
  T("FORMAL EMAIL: closing","I look forward to ___ from you.",["hearing"],"Ungkapan tetap: look forward to + verb-ing (hear → …)."),
  C("MINUTES OF MEETING","The manager said that the office ___ close early on Friday.",["would","will","is"],REP),
  E("The participants discussed the budget and agree on a new schedule.","agree","agreed","Kedua kata kerja harus sama-sama past tense: discussed … agreed."),
  C("MINUTES OF MEETING","The staff ___ attended the training will get a certificate.",["who","which","where"],"Adjective clause untuk orang: who."),
  A("Rapat ditunda karena direktur sedang sakit.","The meeting was postponed because the director was sick.","Postponed = ditunda. Gunakan was + V3 (pasif)."),
  D("Director","Should we hold the meeting online or offline?","Sebaiknya rapat diadakan daring atau luring?",["I suggest online, because three participants are outside the city and it saves travel costs.","Online, please. I like pajamas.","Both are bad."],"Saran profesional disertai alasan."),
  T("Indirect speech","Direct: 'I am busy.' → Ms. Rina said that she ___ busy.",["was"],REP)]}
 ]},
{key:"dkv",title:"Pixel Studio",dept:"Desain Komunikasi Visual",ico:"🎨",place:"Studio desain",
 intro:"Kamu desainer junior di studio kreatif. Kenali alat desain, ikuti proses kerja, temui klien, lalu presentasikan karyamu.",
 missions:[
 {title:"Kenalan dengan Klien",en:"Meet the Client",brief:"Kenalkan dirimu, dengarkan warna dan ukuran, dan letakkan elemen desain.",items:[
  D("Client","Hi, I'm Andi. Are you the designer?","Hai, saya Andi. Apakah kamu desainernya?",["Yes, I am. Nice to meet you, Andi.","Yes, I do.","I'm a poster."],"Are you …? dijawab Yes, I am / No, I'm not."),
  L("Use yellow and green for the background.",["Gunakan kuning dan hijau untuk latar.","Gunakan merah dan biru untuk latar.","Gunakan kuning dan hijau untuk huruf."],"Yellow = kuning, green = hijau, background = latar."),
  X("Tulis warna yang kamu dengar.","orange",["orange"],"Oranye. Ejaan: O-R-A-N-G-E."),
  C("Layout","Put the logo ___ the top of the page.",["at","in","on"],"Frasa tetap: at the top (di bagian atas).","Letakkan logo di bagian atas halaman."),
  C("Daily routine","The designer ___ sketches every morning.",["draws","draw","drawing"],SP,"Desainer itu menggambar sketsa setiap pagi."),
  M("The brushes are under the table.",["Kuasnya ada di bawah meja.","Kuasnya ada di atas meja.","Kuasnya ada di samping meja."],"Under = di bawah."),
  X("Berapa ukuran hurufnya? Tulis angkanya.","twelve",["12","twelve"],"Twelve = 12. Hati-hati, twenty = 20."),
  C("Deadline","The deadline is ___ Friday.",["on","in","at"],"Untuk nama hari gunakan on: on Friday.","Batas waktunya hari Jumat.")]},
 {title:"Draf Pertama",en:"The First Draft",brief:"Ceritakan proses desain yang sudah kamu kerjakan dan tanggapi permintaan klien.",items:[
  C("Yesterday","Yesterday I ___ three logo ideas.",["drew","draw","draws"],"Draw adalah kata kerja tidak beraturan: draw → drew.","Kemarin saya menggambar tiga ide logo."),
  C("Feedback","The client ___ like the first draft.",["didn't","doesn't","wasn't"],DN,"Klien tidak suka draf pertama."),
  D("Senior designer","Did you save the file?","Apakah kamu sudah menyimpan filenya?",["Yes, I did. It's in the project folder.","Yes, I do.","No, it isn't."],DQ),
  D("Client","Can you make the logo bigger?","Bisakah logonya dibuat lebih besar?",["Yes, I can. I'll send the new version today.","No, I can't sing.","Yes, it's big."],"Can you …? dijawab Yes, I can, lalu beri kepastian."),
  M("I think the blue version looks more modern.",["Menurut saya versi biru terlihat lebih modern.","Versi biru terlihat kuno.","Saya tidak suka versi biru."],"I think = menurut saya. More modern = lebih modern."),
  C("Feelings","I was ___ when the client loved my design.",["proud","loud","cloud"],"Proud = bangga.","Saya bangga ketika klien menyukai desain saya."),
  T("Sending the work","When I ___ (finish) the poster, I sent it to the client.",["finished"],"When + kejadian lampau: finish → finished.","Ketika saya selesai membuat poster, saya mengirimkannya ke klien."),
  C("Safety","Cut the paper ___ with the cutter.",["carefully","careful","carefulness"],"Adverb (kata keterangan cara) biasanya berakhiran -ly.","Potong kertasnya dengan hati-hati memakai cutter.")]},
 {title:"Meja Desainer",en:"The Designer's Desk",brief:"Desainer senior meminta alat dan memberi masukan singkat.",items:[
  P("Pick up the pencil.","Ambil pensilnya.",[["✏️","pencil"],["🖌️","brush"],["📐","ruler"]],"You sketch ideas with a pencil."),
  P("Choose a color palette.","Pilih palet warna.",[["🎨","palette"],["🖼️","poster"],["✂️","scissors"]],"A palette holds many colors."),
  P("Hang the poster on the wall.","Gantung posternya di dinding.",[["🖼️","poster"],["🎨","palette"],["💻","laptop"]],"A poster is a big printed picture."),
  P("Use the ruler to draw a straight line.","Gunakan penggaris untuk menggambar garis lurus.",[["📐","ruler"],["✏️","pencil"],["🖍️","crayon"]],"A ruler helps you draw straight lines."),
  P("Open the laptop.","Buka laptopnya.",[["💻","laptop"],["📷","camera"],["🖨️","printer"]],"Designers use a laptop to make digital designs."),
  L("Make the font bigger.",["Perbesar hurufnya.","Ganti warna hurufnya.","Hapus hurufnya."],"Font = jenis huruf. Bigger = lebih besar."),
  L("The client likes bright colors.",["Klien suka warna cerah.","Klien suka warna gelap.","Klien tidak suka warna."],"Bright = cerah. Dark = gelap."),
  M("Send me the draft by Monday.",["Kirimi saya draf paling lambat hari Senin.","Kirimi saya hasil akhir hari Minggu.","Draf sudah dikirim hari Senin."],"By Monday = paling lambat Senin.")]},
 {title:"Proses Desain",en:"Design Process",brief:"Ikuti proses membuat poster dan menyiapkan file cetak.",items:[
  O("SOP: Designing a poster",["First, read the client's brief carefully.","Then, sketch some ideas on paper.","After that, create the design on the computer.","Finally, send the draft and ask for feedback."],ORD),
  A("Pilih warna yang cocok dengan merek.","Choose colors that match the brand.","Match = cocok dengan."),
  C("Layout tip","Put the title at the ___ of the poster.",["top","taste","price"],"Judul biasanya di bagian atas (top).","Letakkan judul di bagian atas poster."),
  M("Save the file as a PDF.",["Simpan file sebagai PDF.","Hapus file PDF itu.","Cetak file PDF itu."],"Save = simpan."),
  O("SOP: Preparing a file for printing",["First, check the size of the design.","Then, change the color mode to CMYK.","Next, export the file in high resolution.","Finally, send the file to the printing shop."],ORD),
  C("Feedback","The text is too small. Please ___ it.",["enlarge","delete","eat"],"Enlarge = memperbesar.","Teksnya terlalu kecil. Tolong perbesar."),
  A("Gunakan tidak lebih dari tiga jenis huruf.","Use no more than three fonts.","No more than = tidak lebih dari."),
  C("Senior designer's advice","You had better ___ a backup of your files.",["make","made","making"],HB,"Sebaiknya kamu membuat cadangan file-filemu.")]},
 {title:"Bertemu Klien",en:"Meeting the Client",brief:"Diskusikan brief dengan klien, terima masukan, dan deskripsikan desainmu.",items:[
  D("Client","Can you design a logo for my coffee shop?","Bisakah kamu mendesain logo untuk kedai kopi saya?",["Sure. Could you tell me about your shop and your customers?","Logos are easy.","No, I only draw cats."],"Sebelum mendesain, pahami dulu klien dan pelanggannya."),
  D("Client","I don't like the colors in this draft.","Saya tidak suka warna di draf ini.",["Thank you for the feedback. Which colors would you prefer?","Then design it yourself.","The colors are perfect."],"Terima masukan dengan sopan, lalu tanyakan keinginan klien."),
  T("Describing a design","The new logo is ___ (simple) than the old one.",["simpler"],"simple → simpler.","Logo baru lebih sederhana daripada yang lama."),
  E("Last week our team finish the banner for the festival.","finish","finished",PAST),
  L("The background is too dark, so the text is hard to read.",["Latarnya terlalu gelap, jadi teksnya sulit dibaca.","Latarnya terlalu terang, jadi teksnya jelas.","Teksnya terlalu besar untuk latarnya."],"Background = latar. Hard to read = sulit dibaca."),
  T("Describing a design","Blue is the ___ (important) color in this brand.",["most important"],"Superlatif kata sifat panjang: the most + adjective.","Biru adalah warna paling penting di merek ini."),
  D("Client","When will the final design be ready?","Kapan desain akhirnya siap?",["I will send it on Thursday, after your last feedback.","Someday.","When I'm happy."],"Beri waktu yang jelas."),
  E("While I was drawing the sketch, the client send a new idea.","send","sent","Past progressive (was drawing) + past simple: send → sent.")]},
 {title:"Presentasi Karya",en:"Presenting Your Work",brief:"Presentasikan desain, jelaskan revisi, dan laporkan kepada art director.",items:[
  C("DESIGN PRESENTATION","I chose green ___ it shows that the product is natural.",["because","although","unless"],"Menjelaskan alasan: because."),
  C("DESIGN PRESENTATION","The logo, ___ uses a clove flower, shows the history of Maluku.",["which","who","when"],"Adjective clause untuk benda: which."),
  T("Indirect speech","Direct: 'The font looks old.' → The client said that the font ___ old.",["looked"],REP),
  E("Last Monday the client said that he likes the second draft.","likes","liked",REP),
  A("Saya menyarankan memakai foto asli produk.","I suggest using real photos of the product.","Suggest + verb-ing."),
  C("Explaining revisions","We made the text bigger ___ older customers can read it easily.",["so that","although","but"],"So that = supaya (tujuan)."),
  D("Client","Why is the design so simple?","Kenapa desainnya sangat sederhana?",["A simple design is easier to remember, and it looks good on small screens like phones.","Because I was lazy.","Simple is simple."],"Pertahankan desainmu dengan alasan yang kuat."),
  T("Report to art director","The client ___ (approve) the final design yesterday.",["approved"],PAST)]}
 ]}
];

const ARG=(who,say,tr,o,hint)=>({t:"arg",who,say,tr,o,hint});

const ARGH="Argumen yang kuat: akui pendapat lawan bicara, beri data atau fakta, lalu tawarkan solusi dengan alasan.";
const EXTRA={
acc:{
 0:[SAY("Good morning. My name is Dimas. I work in the finance department.","Selamat pagi. Nama saya Dimas. Saya bekerja di bagian keuangan.","Ucapkan pelan dan jelas. Tekanan suara pada FI-nance dan de-PART-ment.")],
 1:[SAY("Yesterday I checked ten receipts and counted the cash.","Kemarin saya memeriksa sepuluh kuitansi dan menghitung uang kas.","Akhiran -ed: checked dibaca 'chekt', counted dibaca 'coun-tid'.")],
 2:[R("NOTICE","Finance Office Hours","FINANCE OFFICE\nOpen: Monday – Friday, 08.00 – 15.00\nBreak: 12.00 – 13.00\nPayments after 14.30 will be recorded on the next working day.\nPlease bring your receipt.",[
   Q("When is the finance office closed for a break?",["12.00 – 13.00","08.00 – 15.00","After 14.30"],"Cari kata 'Break'."),
   Q("A customer pays at 14.45 on Friday. When will the payment be recorded?",["On Monday","On Friday","On Saturday"],"Setelah 14.30 dicatat pada hari kerja berikutnya. Sabtu bukan hari kerja.",true)])],
 3:[R("SOP","Petty Cash Rules","PETTY CASH RULES\n1. The maximum petty cash payment is Rp500.000.\n2. Every payment needs a receipt.\n3. Payments above Rp500.000 must use a bank transfer and need the manager's signature.\n4. Count the petty cash every Friday afternoon.",[
   Q("How often do staff count the petty cash?",["Once a week","Every day","Once a month"],"Every Friday = sekali seminggu.",true),
   Q("A staff member needs Rp750.000 for a new printer. What must she do?",["Use a bank transfer and get the manager's signature","Take the money from petty cash","Pay without a receipt"],"Lihat aturan nomor 3: di atas Rp500.000.",true)])],
 4:[R("EMAIL","Re: Invoice INV-0457","From: Sari (Toko Maju)\nTo: Finance Staff\nSubject: Re: Invoice INV-0457\n\nHello,\nI received your invoice for Rp4.200.000 yesterday. However, we only ordered 30 boxes of paper, not 35. Each box costs Rp120.000. Could you please send a new invoice?\nThank you,\nSari",[
   Q("What does Sari want?",["A new invoice","A discount","More boxes of paper"],"Lihat kalimat 'Could you please…'."),
   Q("What is the correct total for the new invoice?",["Rp3.600.000","Rp4.200.000","Rp120.000"],"30 boxes × Rp120.000 = Rp3.600.000.",true),
   Q("How does Sari probably feel?",["Polite, but she wants the mistake fixed","Very angry","Happy with the invoice"],"Ia memakai kata sopan (please, thank you) tetapi menunjukkan kesalahan.",true)]),
   SAY("Could you please check the invoice? I think the total is wrong.","Bisakah Anda memeriksa fakturnya? Menurut saya totalnya salah.","Naikkan nada suara di akhir pertanyaan: '…check the invoice?'")],
 5:[R("REPORT","Café Senja – Three-Month Summary","CAFÉ SENJA – SUMMARY\nMonth | Income | Expenses\nAugust | Rp10.800.000 | Rp8.900.000\nSeptember | Rp11.000.000 | Rp9.000.000\nOctober | Rp12.000.000 | Rp9.500.000\n\nNote: Electricity cost went up in October because the café added two new freezers.",[
   Q("In which month was the profit the highest?",["October","August","September"],"Laba = income − expenses: Agustus 1,9 juta; September 2 juta; Oktober 2,5 juta.",true),
   Q("Why did expenses go up in October?",["The café added two new freezers","Coffee prices went down","The café closed for a week"],"Baca bagian Note."),
   Q("What can you infer about the café's business?",["It is growing every month","It is losing money","Its income is going down"],"Pendapatan naik dari Agustus sampai Oktober.",true)]),
   ARG("Owner","I want to cut the staff salaries to save money. What do you think?","Saya ingin memotong gaji staf untuk berhemat. Bagaimana menurutmu?",["I understand, but our profit is growing. I suggest we reduce electricity use first, because cutting salaries can make good staff leave.","Yes, cut everything now.","I don't care about money."],ARGH),
   WR("Tulis email singkat (minimal 30 kata) kepada pemilik Café Senja tentang hasil bulan Oktober. Sebutkan laba, alasan kenaikan biaya, dan satu rekomendasi.",
    "Dear Mrs. Lestari,\nI am writing to report the October result. Our income was Rp12.000.000 and our expenses were Rp9.500.000, so we made a profit of Rp2.500.000. The expenses went up because we added two new freezers. I recommend turning off one freezer at night to save electricity.\nBest regards,\nDimas",
    "Dear …,\nI am writing to report … Our income was … and our expenses were …, so we made a profit of … The expenses went up because … I recommend …\nBest regards,\n…",
    [["Salam pembuka (Dear …)","\\bdear\\b"],["Menyebut angka atau laba","\\d|profit"],["Memberi alasan (because)","\\bbecause\\b"],["Memberi rekomendasi (recommend/suggest)","recommend|suggest"],["Salam penutup (regards/thank you)","regards|thank"]])]
},
tou:{
 0:[SAY("Good morning, everyone. Welcome to Bacan Island. My name is Rani, and I am your guide today.","Selamat pagi semuanya. Selamat datang di Pulau Bacan. Nama saya Rani, saya pemandu kalian hari ini.","Tersenyum saat mengucapkan 'Welcome'. Suara jelas dan cukup keras untuk rombongan.")],
 1:[SAY("Last weekend, we visited the waterfall and swam in the river.","Akhir pekan lalu kami mengunjungi air terjun dan berenang di sungai.","Visited dibaca 'vi-zi-tid'. Swam adalah bentuk lampau dari swim.")],
 2:[R("SIGN","Harbor Notice","HARBOR NOTICE\nBoats to the islands: 08.00 and 13.00\nTicket: Rp75.000 (adult) · Rp40.000 (child under 12)\nLife jackets are free.\nNo boats when the wind is strong.",[
   Q("How much does a ticket for a 10-year-old child cost?",["Rp40.000","Rp75.000","It is free"],"Anak di bawah 12 tahun: Rp40.000."),
   Q("Today the wind is very strong. What will happen?",["The boats will not leave","The tickets will be free","The boats will leave at 13.00 only"],"Baca baris terakhir.",true)])],
 3:[R("RULES","Snorkeling Safety Rules","SNORKELING SAFETY RULES\n• Always swim with a buddy.\n• Do not touch or stand on the coral.\n• Stay inside the area with the yellow buoys.\n• Come back to the boat when you hear three whistles.",[
   Q("What should guests do when they hear three whistles?",["Return to the boat","Swim to the yellow buoys","Look for coral"],"Lihat aturan terakhir."),
   Q("Why do guests probably need to stay inside the yellow buoys?",["Because it is the safe area","Because the coral is outside","Because boats are not allowed there"],"Aturan dibuat untuk keselamatan tamu.",true)])],
 4:[R("BROCHURE","Explore Bacan – 2 Days","EXPLORE BACAN – 2 DAYS, 1 NIGHT\nDay 1: Arrive at Labuha harbor, visit the old Barnaveld fort, watch the sunset at the beach.\nDay 2: Snorkeling at a small island, lunch with grilled fish, return at 15.00.\nPrice: Rp1.250.000/person (hotel, meals and boat included). Minimum 4 people.",[
   Q("What do guests do on the first day?",["Visit an old fort and watch the sunset","Go snorkeling","Eat grilled fish for lunch"],"Lihat Day 1."),
   Q("Two friends want to book this tour. What is the problem?",["The tour needs at least four people","The tour is too short","The hotel is not included"],"Minimum 4 people.",true),
   Q("Who is this tour probably best for?",["Small groups who like history and the sea","People who want to stay for a week","Tourists who are afraid of boats"],"Isinya benteng (sejarah) dan laut.",true)]),
   SAY("This fort was built a long time ago to protect the spice trade.","Benteng ini dibangun lama sekali untuk melindungi perdagangan rempah.","Built dibaca 'bilt'. Beri jeda kecil setelah 'ago'.")],
 5:[R("REVIEW","Guest Review","★★☆☆☆  \"Beautiful island, but…\"\nThe beach was amazing and our guide was friendly. However, the boat left one hour late, and nobody told us why. Lunch was cold. I will only come back if the company improves its communication.\n– Mark, Australia",[
   Q("What did Mark like?",["The beach and the guide","The boat and the lunch","The communication"],"Lihat kalimat pertama."),
   Q("What is Mark's main complaint?",["Nobody explained the delay","The guide was rude","The beach was dirty"],"'nobody told us why'",true),
   Q("What should the company do first?",["Tell guests quickly when there is a delay","Build a new beach","Change the guide"],"Ia mau kembali jika komunikasinya diperbaiki.",true)]),
   ARG("Manager","Should we reply to this bad review or just ignore it?","Haruskah kita membalas ulasan buruk ini atau mengabaikannya?",["We should reply, apologize and explain how we will improve, because other tourists will read our answer.","Ignore it. Reviews don't matter.","Delete our page."],ARGH),
   WR("Tulis balasan (minimal 30 kata) untuk ulasan Mark. Ucapkan terima kasih, minta maaf, jelaskan perbaikan, dan undang dia datang lagi.",
    "Dear Mark,\nThank you for your review. We are very sorry that the boat was late and that nobody explained the delay. From now on, our guides will inform guests immediately if there is a problem. We hope you will visit Bacan again.\nBest regards,\nIsland Guide Team",
    "Dear …,\nThank you for … We are very sorry that … From now on, we will … We hope you will …\nBest regards,\n…",
    [["Salam pembuka (Dear …)","\\bdear\\b"],["Ucapan terima kasih","thank"],["Permintaan maaf (sorry/apologize)","sorry|apologi"],["Rencana perbaikan (will …)","\\bwill\\b"],["Undangan datang lagi (again/visit)","again|visit|come back"]])]
},
mkt:{
 0:[SAY("Hello! Welcome to our shop. Our snacks are fresh and cheap.","Halo! Selamat datang di toko kami. Camilan kami segar dan murah.","Ucapkan dengan ramah dan bersemangat, seperti menyapa pembeli sungguhan.")],
 1:[SAY("Yesterday we sold fifty boxes of cookies at the bazaar.","Kemarin kami menjual lima puluh kotak kue di bazar.","Fifty (50) tekanannya di depan: FIF-ty. Fifteen (15) di belakang: fif-TEEN.")],
 2:[R("PRICE LIST","Kedai Rempah","KEDAI REMPAH – PRICE LIST\nClove tea (box of 20) … Rp35.000\nNutmeg candy (pack) … Rp15.000\nCinnamon cookies (jar) … Rp45.000\nSpecial: Buy 2 packs of nutmeg candy, get 1 free!",[
   Q("How much is a jar of cinnamon cookies?",["Rp45.000","Rp35.000","Rp15.000"],"Cari 'Cinnamon cookies'."),
   Q("A customer buys two packs of nutmeg candy. How many packs does she get?",["Three","Two","Four"],"Buy 2, get 1 free.",true)])],
 3:[R("GUIDE","How to Write a Good Caption","HOW TO WRITE A GOOD CAPTION\n1. Start with a question or a surprising fact.\n2. Say what the product does for the customer.\n3. Keep it under 30 words.\n4. End with a call to action, for example: \"Order now!\"",[
   Q("How should a caption end?",["With a call to action","With a long story","With the price only"],"Lihat langkah 4."),
   Q("Which caption follows the guide best?",["Tired in the afternoon? Our clove tea gives you fresh energy. Order now!","Clove tea. It is tea. We sell it.","Our company started in 2010 and we have many products, many workers and a big office in the city."],"Cek: pertanyaan, manfaat, singkat, ajakan.",true)])],
 4:[R("CHAT","Customer Chat","Customer (10:02): Hi, I ordered 3 jars of cinnamon cookies on Monday. Today is Thursday and I still haven't received them.\nCustomer (10:03): The tracking number doesn't work.\nCustomer (10:15): Hello?? Is anyone there?",[
   Q("What is the customer's problem?",["Her order has not arrived","The cookies taste bad","She wants a discount"],"Baca pesan pertama."),
   Q("How does the customer feel at 10:15?",["Impatient, because nobody answered","Happy and relaxed","Confused about the price"],"Tanda tanya ganda dan 'Is anyone there?'",true),
   Q("What should the shop do first?",["Apologize and check the tracking number","Send her a new price list","Wait until tomorrow"],"Pelanggan menunggu jawaban dan nomor resinya bermasalah.",true)]),
   SAY("I'm sorry for the delay. Let me check your order right now.","Mohon maaf atas keterlambatannya. Saya cek pesanan Anda sekarang juga.","Nada tenang dan sopan. Tekanan pada SOR-ry dan right NOW.")],
 5:[R("DATA","Promotion Results – September","PROMOTION RESULTS – SEPTEMBER\nChannel | Cost | New customers\nPosters | Rp500.000 | 10\nInstagram videos | Rp300.000 | 45\nRadio | Rp1.000.000 | 15",[
   Q("Which channel brought the most new customers?",["Instagram videos","Radio","Posters"],"Lihat kolom New customers."),
   Q("Which channel was the most expensive for each new customer?",["Radio","Posters","Instagram videos"],"Radio ±Rp66.700 per orang, poster Rp50.000, video ±Rp6.700.",true),
   Q("What is the best conclusion?",["Instagram videos were the cheapest and most effective channel","Posters worked better than videos","Radio should get more money"],"Bandingkan biaya dan hasilnya.",true)]),
   ARG("Manager","Radio is famous. Why should we stop the radio ads?","Radio itu terkenal. Kenapa kita harus berhenti beriklan di radio?",["Radio cost Rp1.000.000 but brought only 15 customers, while videos brought 45 for Rp300.000. We can move the money to videos.","Because I don't like radio.","Radio is old."],ARGH),
   WR("Tulis pesan (minimal 30 kata) kepada manajer: laporkan hasil promosi September dan usulkan rencana untuk bulan Oktober.",
    "Dear Mr. Fadli,\nI would like to report the September promotion results. Instagram videos brought 45 new customers for only Rp300.000, while radio brought 15 customers for Rp1.000.000. I suggest using the radio budget for more videos in October because they are cheaper and more effective.\nBest regards,\nNisa",
    "Dear …,\nI would like to report … brought … new customers, while … I suggest … because …\nBest regards,\n…",
    [["Salam pembuka (Dear …)","\\bdear\\b"],["Menyebut data (angka)","\\d"],["Membandingkan (while/but/than)","\\bwhile\\b|\\bbut\\b|\\bthan\\b"],["Memberi usulan (suggest/recommend)","suggest|recommend"],["Memberi alasan (because)","\\bbecause\\b"]])]
},
mplb:{
 0:[SAY("Good morning. Welcome to PT Maju Jaya. How can I help you?","Selamat pagi. Selamat datang di PT Maju Jaya. Ada yang bisa saya bantu?","Nada naik di akhir pertanyaan 'How can I help you?'")],
 1:[SAY("Yesterday I sent twenty letters and called the hotel.","Kemarin saya mengirim dua puluh surat dan menelepon hotel.","Called dibaca 'kold' (satu suku kata).")],
 2:[R("MEMO","Office Memo","MEMO\nTo: All staff\nFrom: Office Manager\nDate: 3 November\nThe photocopy machine on the second floor is broken. Please use the machine on the first floor until Friday. Thank you.",[
   Q("Which photocopy machine can staff use now?",["The one on the first floor","The one on the second floor","No machine"],"Baca kalimat 'Please use…'."),
   Q("When will the second-floor machine probably work again?",["After Friday","Today","Next year"],"'until Friday' = sampai hari Jumat.",true)])],
 3:[R("SOP","Visitor Procedure","VISITOR PROCEDURE\n1. Visitors sign the guest book at the front desk.\n2. The receptionist calls the staff member they want to meet.\n3. Visitors wear a visitor badge at all times.\n4. Visitors return the badge before they leave.",[
   Q("What must visitors do before they leave?",["Return the badge","Sign the guest book","Call the staff"],"Lihat langkah 4."),
   Q("A visitor walks to the second floor without a badge. Which rule did he break?",["Rule 3","Rule 1","Rule 4"],"Badge harus dipakai setiap saat (at all times).",true)])],
 4:[R("EMAIL","Monday Meeting – New Time","From: Ms. Rina (Director's Office)\nSubject: Monday meeting – new time\n\nDear team,\nThe Monday meeting will start at 13.00, not 09.00, because the director has a flight in the morning. The room has also changed to Meeting Room B. Please bring your monthly reports.\nRegards,\nRina",[
   Q("What changed about the meeting?",["The time and the room","The day and the topic","Only the room"],"Baca kalimat pertama dan kedua."),
   Q("Why can't the director come in the morning?",["She is travelling by plane","She is sick","She has another meeting"],"'has a flight' = naik pesawat.",true),
   Q("What should staff prepare?",["Their monthly reports","A flight ticket","Meeting Room A"],"Lihat kalimat terakhir.")]),
   SAY("I'm sorry, Ms. Rina is in a meeting. May I take a message?","Mohon maaf, Bu Rina sedang rapat. Boleh saya catat pesannya?","Nada sopan. Naikkan nada di akhir 'May I take a message?'")],
 5:[R("MINUTES","Minutes of Meeting","MINUTES OF MEETING\nDate: 10 November · Attendees: 8 · Absent: 2\n1. The team agreed to use online forms for leave requests.\n2. The budget for office supplies will decrease by 10%.\n3. Action: Dewi will train all staff on the online form before 20 November.\n4. Next meeting: 1 December.",[
   Q("How many people were invited to the meeting?",["Ten","Eight","Two"],"Hadir 8 + tidak hadir 2.",true),
   Q("Who will train the staff?",["Dewi","The director","All staff"],"Lihat poin 3."),
   Q("What can you infer about paper leave forms?",["They will not be used anymore","They will be cheaper","They are more popular now"],"Tim sepakat memakai formulir online.",true)]),
   ARG("Director","Online forms are complicated. Why not keep paper forms?","Formulir online itu rumit. Kenapa tidak tetap pakai kertas?",["Online forms are faster to check and save paper. Dewi will train everyone, so the change will not be difficult.","Because paper is boring.","I don't know."],ARGH),
   WR("Tulis email (minimal 30 kata) kepada semua staf tentang perubahan jam dan ruang rapat hari Senin.",
    "Dear all,\nI would like to inform you that the Monday meeting will start at 13.00 instead of 09.00 because the director has a morning flight. The meeting will be in Meeting Room B. Please bring your monthly reports.\nThank you,\nRina",
    "Dear all,\nI would like to inform you that … will start at … instead of … because … The meeting will be in … Please bring …\nThank you,\n…",
    [["Salam pembuka (Dear …)","\\bdear\\b"],["Menyebut jam baru","\\d"],["Memberi alasan (because)","\\bbecause\\b"],["Permintaan sopan (please)","\\bplease\\b"],["Salam penutup (thank you/regards)","thank|regards"]])]
},

 4:[R("EMAIL","Poster Draft 1 – Feedback","From: Pak Hendra (Kopi Pala)\nSubject: Poster draft 1\n\nHi,\nThanks for the draft. I like the photo of the coffee cup. However, the title is too small and people can't read it from far away. Also, please add our Instagram account. The rest is fine.\nHendra",[
   Q("What does Pak Hendra like?",["The photo of the coffee cup","The title","The size"],"Lihat 'I like…'."),
   Q("Why does the title need to be bigger?",["People can't read it from far away","He doesn't like the font","The poster is too small"],"Baca kalimat setelah 'However'."),

 5:[R("SURVEY","Logo Survey – 40 People","LOGO SURVEY – 40 RESPONDENTS\nLogo A (nutmeg icon, brown): 26 votes – \"easy to remember\", \"looks local\"\nLogo B (cup icon, black): 14 votes – \"modern\", \"too common\"",[

const canSpeak=("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);
function speak(t){if(!canSpeak)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;const vs=speechSynthesis.getVoices();const v=vs.find(v=>/^en(-|_)US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
function stopSpeak(){if(canSpeak)try{speechSynthesis.cancel()}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shuffleNot(a){let s=shuffle(a),n=0;while(s.join("|")===a.join("|")&&n++<12)s=shuffle(a);return s}
function rank(x){return x>=2500?"Expert":x>=1500?"Senior Staff":x>=700?"Skilled Worker":x>=200?"Junior Staff":"Trainee"}

const bossOpen=w=>tested(w)&&w.missions.every((m,i)=>i<Math.min(placeOf(w),4)||st(w.key+"-"+i)>=2);
function placementFor(s){return s>=11?4:s>=10?3:s>=8?2:s>=6?1:0}
const PLACE_RULE=[["0–5","Misi 1 · Rookie"],["6–7","Misi 2 · Starter"],["8–9","Misi 3 · Explorer"],["10","Misi 4 · Apprentice"],["11–12","Misi 5 · Technician"]];

function topbar(back){return `<div class="bar">${back?`<button class="back" id="bk">← ${esc(back)}</button>`:`<span class="mono">SMK · English for Work</span>`}<span class="chip">⚡ <b id="xpv">${S.xp}</b> XP · ${rank(S.xp)}</span></div>`}

function copyText(text,btn){const done=()=>{btn.textContent="Tersalin ✓"};
 try{navigator.clipboard.writeText(text).then(done,()=>fallbackCopy(text,btn))}catch(e){fallbackCopy(text,btn)}}
function fallbackCopy(text,btn){const ta=document.createElement("textarea");ta.value=text;ta.className="ta";ta.readOnly=true;btn.insertAdjacentElement("afterend",ta);ta.focus();ta.select();btn.textContent="Pilih teks di bawah, lalu salin"}
function testSummary(w){const t=S.tests[w.key]||[];if(!t.length)return"Kerjakan sebelum mulai bermain";const f=t[0],l=t[t.length-1];return t.length===1?`Tes awal: ${f.s}/${f.t}`:`Awal ${f.s}/${f.t} → Terakhir ${l.s}/${l.t}`}
function pct(o){return o&&o.n?Math.round(o.f/o.n*100):null}

 else if(mode==="boss"){lv=BOSS;items=shuffle(lastTwo(w).filter(x=>x.t!=="say"&&x.t!=="write")).slice(0,BOSS.count);}
 else if(mode==="review"){lv={name:"Latihan Ulang",help:"tap",lives:0};items=shuffle(reviewIds(w).map(id=>IDX[id])).slice(0,10);if(!items.length)return world(wi);}
 else{lv={name:"Tes Kemampuan",help:"none",lives:0};items=buildTest(w);}
 G={wi,mode,mi,lv,items,i:0,err:0,errNow:0,itemErr:0,xp:0,lives:lv.lives||0,maxLives:lv.lives||0,done:false,el:{},correct:0};
 step();
}

 clearTimer();stopSpeak();

 const code=`${w.key.toUpperCase()}-${G.mode==="mission"?G.mi+1:G.mode[0].toUpperCase()}${String(G.i+1).padStart(2,"0")}`;
 const trBlock=tr=>!tr?"":lv.help==="full"?`<div class="tr">${esc(tr)}</div>`:lv.help==="tap"?`<div class="tr" id="trx" hidden>${esc(tr)}</div>`:"";

 const optList=arr=>`<div class="opts">${arr.map((o,j)=>`<button class="opt" data-o="${j}">${esc(o)}</button>`).join("")}</div>`;
 const listenBox=(say,textHelp)=>`<div class="listen">${canSpeak?`<button class="speak" data-say="${esc(say)}" aria-label="Putar audio">🔊</button><span class="mono">Ketuk untuk mendengar (boleh diulang)</span>`:""}
  <div class="hidden-text" id="ht" ${canSpeak?"hidden":""}>${esc(say)}</div>${canSpeak&&textHelp?`<button class="trbtn" id="showtxt">Tampilkan teks (bantuan)</button>`:""}</div>`;
 let body="";G.opts=null;
 switch(it.t){

  <div class="opts pics">${G.opts.map((o,j)=>`<button class="opt pic" data-o="${j}"><span class="em" aria-hidden="true">${o[0]}</span><span class="lb"></span></button>`).join("")}</div>`;break;
 case "lis":G.opts=shuffle(it.o);

 case "dict":

  <form class="row" id="tf" autocomplete="off"><input class="inp" id="ti" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Tulis yang kamu dengar…" aria-label="Jawaban"><button class="btn" type="submit">Periksa</button></form>`;break;
 case "mean":G.opts=shuffle(it.o);
  body=`<p class="task">Apa arti kalimat ini?</p><div class="say">${sp(it.say)}<div><div class="who">Kalimat kerja</div><div class="en">${esc(it.say)}</div></div></div>${optList(G.opts)}`;break;
 case "dlg":case "arg":G.opts=shuffle(it.o);
  body=`<p class="task">${it.t==="arg"?"Pertahankan pendapatmu: pilih argumen yang paling kuat dan sopan.":"Pilih jawaban yang paling sopan dan membantu."}</p>
  <div class="say">${sp(it.say)}<div><div class="who">${esc(it.who)}</div><div class="en">“${esc(it.say)}”</div>${trBlock(it.tr)}</div></div>${trBtn(it.tr)}${optList(G.opts)}`;break;
 case "cloze":G.opts=shuffle(it.o);

  <div class="say"><div><div class="who">${esc(it.ctx)}</div><div class="en">${blank(it.s)}</div>${trBlock(it.tr)}</div></div>${trBtn(it.tr)}${optList(G.opts)}`;break;

  <div class="say"><div><div class="who">${esc(it.ctx)}</div><div class="en">${blank(it.s)}</div>${trBlock(it.tr)}</div></div>${trBtn(it.tr)}
  <form class="row" id="tf" autocomplete="off"><input class="inp" id="ti" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Ketik jawabanmu…" aria-label="Jawaban"><button class="btn" type="submit">Periksa</button></form>`;break;
 case "err":G.words=it.s.split(" ");
  body=`<p class="task">Ada satu kata yang salah secara tata bahasa. Ketuk kata itu.</p>
  <div class="say"><div><div class="who">Periksa kalimat</div><div class="words">${G.words.map((x,j)=>`<button class="tile" data-x="${j}">${esc(x)}</button>`).join("")}</div></div></div>`;break;

  body=`<p class="task">Susun kata menjadi kalimat Bahasa Inggris yang benar.</p>

  <div class="slot" id="slot" aria-label="Kalimatmu"></div><div class="bank">${G.arr.words.map((x,j)=>`<button class="tile" data-t="${j}">${esc(x)}</button>`).join("")}</div>
  <div class="row"><button class="btn" id="chk" disabled>Periksa</button><button class="btn ghost" id="clr">Ulangi</button></div>`;break;
 case "ord":G.arr={words:shuffleNot(it.steps),picked:[],target:it.steps.join("|")};
  body=`<p class="task">Susun langkah-langkah SOP dengan urutan yang benar. Ketuk langkah satu per satu.</p>
  <div class="say"><div><div class="who">Prosedur</div><div class="en" style="font-size:20px">${esc(it.ctx)}</div></div></div>
  <div class="slot col" id="slot" aria-label="Urutanmu"></div><div class="bank col">${G.arr.words.map((x,j)=>`<button class="tile step" data-t="${j}">${esc(x)}</button>`).join("")}</div>
  <div class="row"><button class="btn" id="chk" disabled>Periksa</button><button class="btn ghost" id="clr">Ulangi</button></div>`;break;
 case "read":
  body=`<p class="task">Baca teks kerja ini dengan teliti, lalu jawab pertanyaannya. Sebagian jawaban tidak tertulis langsung (tersirat).</p>${renderDoc(it)}<div id="rq"></div>`;break;
 case "say":G.said=0;
  body=`<p class="task">Latihan berbicara: dengarkan contoh, lalu ucapkan kalimat ini dengan suara keras.</p>
  <div class="say">${sp(it.say)}<div><div class="who">Ucapkan kalimat ini</div><div class="en">${esc(it.say)}</div>${trBlock(it.tr)}</div></div>${trBtn(it.tr)}
  <p class="tipbox">💡 ${esc(it.tip)}</p>
  <div class="row"><button class="btn ghost" id="said">🗣️ Saya sudah mengucapkannya (0/3)</button></div><div id="rate"></div>`;break;
 case "write":
  body=`<p class="task">Tugas menulis. Hasilnya disalin dan dikirim ke guru untuk dinilai.</p>
  <div class="say"><div><div class="who">Tugas</div><div class="en" style="font-size:18px;font-weight:400;line-height:1.5">${esc(it.task)}</div></div></div>
  <div class="frame"><span class="mono">Kerangka kalimat (boleh diikuti)</span><pre class="pre">${esc(it.frame)}</pre></div>
  <details class="model" id="md"><summary>Lihat contoh teks (bantuan, XP berkurang)</summary><pre class="pre">${esc(it.model)}</pre></details>
  <label class="lbl" for="wa">Tulisanmu</label><textarea class="ta" id="wa" rows="8" placeholder="Tulis teksmu dalam bahasa Inggris…"></textarea>
  <ul class="checks" id="ck"></ul>
  <div class="row"><button class="btn" id="ws" disabled>Kirim tulisan</button><span class="mono" id="wc">0 kata</span></div>`;break;
 }
 app.innerHTML=`${topbar(w.title)}
 <article class="ticket"><div class="tk-h"><span class="mono">Work order · ${code} · ${esc(lv.name)}</span>
  <div class="stat">${hearts()}<span>${G.i+1}/${G.items.length}</span></div></div>
  <div class="tk-h tk-el"><span class="mono">Elemen CP: ${ELEM[it.t]}</span></div>
  ${G.mode==="boss"?`<div class="timer" id="tm"><i style="width:100%"></i></div>`:""}
 <div class="tk-b">${G.i===0?`<div><h2 class="mt">${esc(modeTitle(w))}</h2><p class="task" style="margin-top:6px">${esc(brief)}</p></div>`:""}
 ${body}<div id="fb"></div></div></article>`;
 document.getElementById("bk").onclick=()=>world(G.wi);
 app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say));
 const tb=document.getElementById("trb");if(tb)tb.onclick=()=>{document.getElementById("trx").hidden=false;tb.remove()};
 const stx=document.getElementById("showtxt");if(stx)stx.onclick=()=>{document.getElementById("ht").hidden=false;stx.remove()};
 ({arr:bindArr,ord:bindArr,type:bindType,dict:bindType,err:bindErr,read:readQ,say:bindSay,write:bindWrite}[it.t]||bindChoose)(it);
 if(["pick","lis","dict"].includes(it.t)&&G.i>0)speak(it.say);
 if(G.mode==="boss")startTimer(it.t==="read"?100:45);
 window.scrollTo({top:0});
}
function renderDoc(it){
 let out="",tbl=[];const flush=()=>{if(tbl.length){out+=`<div class="tblw"><table>${tbl.map((r,i)=>`<tr>${r.split("|").map(c=>i?`<td>${esc(c.trim())}</td>`:`<th>${esc(c.trim())}</th>`).join("")}</tr>`).join("")}</table></div>`;tbl=[]}};
 it.text.split("\n").forEach(l=>{if(l.includes("|"))tbl.push(l);else{flush();out+=l.trim()?`<p>${esc(l)}</p>`:`<div class="sp"></div>`}});flush();
 return `<div class="doc"><div class="doc-h"><span class="mono">${esc(it.kind)}</span><strong>${esc(it.title)}</strong></div><div class="doc-b">${out}</div></div>`;
}
function startTimer(sec){
 let left=sec;const bar=document.getElementById("tm");if(!bar)return;const i=bar.querySelector("i");i.style.width="100%";bar.classList.remove("low");
 timerId=setInterval(()=>{if(G.done){clearTimer();return}left--;i.style.width=(left/sec*100)+"%";bar.classList.toggle("low",left<=10);
  if(left<=0){clearTimer();miss("Waktu habis! Satu nyawa hilang. Coba jawab lagi.",true);if(!G.done&&G.lives>0)startTimer(sec)}},1000);
}
function disableAll(){app.querySelectorAll(".tk-b button.opt,.tk-b .tile,.tk-b .inp,.tk-b form button,#chk,#clr").forEach(x=>{x.disabled=true;if(x.tagName==="INPUT")x.readOnly=true})}
function testAnswer(ok){G.done=true;if(ok)G.correct++;const L=levelOf(cur());G.byLv=G.byLv||{};G.byLv[L]=G.byLv[L]||[0,0];G.byLv[L][1]++;if(ok)G.byLv[L][0]++;disableAll();showNext("",`<div class="fb"><strong>Jawaban tercatat.</strong><span>Hasilnya ditampilkan setelah tes selesai.</span></div>`)}

/* ---------- ANSWER HANDLERS ---------- */
function bindChoose(it){
 app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{if(G.done)return;
  const opt=G.opts[+b.dataset.o],ok=it.t==="pick"?opt[1]===it.o[0][1]:opt===it.o[0];
  if(G.mode==="test"){b.classList.add("sel");return testAnswer(ok)}
  if(ok){b.classList.add("ok");app.querySelectorAll("[data-o]").forEach(x=>x.disabled=true);
   if(it.t==="pick")app.querySelectorAll(".opt.pic").forEach((x,k)=>x.querySelector(".lb").textContent=G.opts[k][1]);
   if(it.t==="cloze")document.getElementById("blank").textContent=it.o[0];
   if(it.t==="lis"){const h=document.getElementById("ht");if(h)h.hidden=false;const s=document.getElementById("showtxt");if(s)s.remove()}
   if(it.t==="dlg"||it.t==="arg")speak(it.o[0]);else if(it.t==="cloze")speak(it.s.replace("___",it.o[0]).replace(/^Direct:.*?→\s*/,""));
   correct(it.hint);
  }else{b.classList.add("no");b.disabled=true;miss(it.hint)}});
}
function bindType(it){
 const f=document.getElementById("tf"),inp=document.getElementById("ti"),isD=it.t==="dict";
 const sq=s=>isD?norm(s).replace(/[.,\s-]/g,""):norm(s);
 f.onsubmit=e=>{e.preventDefault();if(G.done)return;const v=sq(inp.value);if(!v)return;const ok=it.ans.some(a=>sq(a)===v);
  if(G.mode==="test")return testAnswer(ok);
  if(ok){inp.classList.remove("no");inp.classList.add("ok");inp.readOnly=true;f.querySelector("button").disabled=true;
   if(isD){document.getElementById("ht").hidden=false;correct(`Kamu mendengar: “${it.say}”. ${it.hint}`)}
   else{document.getElementById("blank").textContent=it.ans[0];speak(it.s.replace("___",it.ans[0]).replace(/\s*\(.*?\)/,"").replace(/^Direct:.*?→\s*/,""));correct(it.hint)}}
  else{inp.classList.add("no");inp.classList.remove("shake");void inp.offsetWidth;inp.classList.add("shake");const a=it.ans[0];
   if(isD)miss(G.errNow>=1?`${it.hint} Jawaban: ${a}.`:"Dengarkan sekali lagi dengan teliti.");
   else miss(it.hint+(G.errNow>=1?` Petunjuk: diawali “${a.slice(0,Math.max(1,Math.ceil(a.length/3)))}…”, ${a.length} huruf.`:""));}};
}
function bindErr(it){
 app.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{if(G.done)return;const ok=G.words[+b.dataset.x].replace(/[.,!?]/g,"")===it.bad;
  if(G.mode==="test"){b.classList.add("sel");return testAnswer(ok)}
  if(ok){b.classList.add("ok");b.textContent=b.textContent.replace(it.bad,it.fix);app.querySelectorAll("[data-x]").forEach(x=>x.disabled=true);
   const fixed=it.s.replace(it.bad,it.fix);speak(fixed);correct(`Benar: “${fixed}” ${it.hint}`);}
  else{b.classList.add("no");b.disabled=true;miss(it.hint)}});

function bindArr(it){
 const slot=document.getElementById("slot"),chk=document.getElementById("chk"),isOrd=it.t==="ord";
 const draw=()=>{slot.className="slot"+(isOrd?" col":"");
  slot.innerHTML=G.arr.picked.map((j,p)=>`<button class="tile${isOrd?" step":""}" data-p="${p}">${isOrd?`<b>${p+1}.</b>`:""}${esc(G.arr.words[j])}</button>`).join("");
  app.querySelectorAll("[data-t]").forEach(b=>b.classList.toggle("used",G.arr.picked.includes(+b.dataset.t)));
  chk.disabled=G.arr.picked.length!==G.arr.words.length;
  slot.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{if(G.done)return;G.arr.picked.splice(+b.dataset.p,1);draw()})};
 app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{if(G.done)return;const j=+b.dataset.t;if(!G.arr.picked.includes(j)){G.arr.picked.push(j);draw()}});
 document.getElementById("clr").onclick=()=>{if(G.done)return;G.arr.picked=[];draw();fb("")};
 chk.onclick=()=>{const s=G.arr.picked.map(j=>G.arr.words[j]).join(isOrd?"|":" ");
  if(s===G.arr.target){slot.className="slot ok"+(isOrd?" col":"");app.querySelectorAll(".tile").forEach(b=>b.disabled=true);chk.disabled=true;document.getElementById("clr").disabled=true;
   if(!isOrd)speak(it.w);correct(isOrd?"Urutan prosedur sudah benar.":`“${it.w}”`);}
  else{slot.className="slot no"+(isOrd?" col":"");let extra="";
   if(G.errNow>=1){if(isOrd){const k=G.arr.picked.findIndex((j,p)=>G.arr.words[j]!==it.steps[p]);extra=` Petunjuk: langkah ke-${k+1} belum tepat.`}else extra=` Petunjuk: kalimat dimulai dengan “${it.w.split(" ").slice(0,2).join(" ")} …”`}
   miss(it.hint+extra);}};
 draw();
}

 document.getElementById("rq").innerHTML=`<div class="rq"><span class="mono">Pertanyaan ${k+1}/${it.qs.length} · ${qq.imp?"Informasi tersirat":"Informasi tersurat"}</span><p class="qtext">${esc(qq.q)}</p>

function bindWrite(it){
 const ta=document.getElementById("wa"),ck=document.getElementById("ck"),ws=document.getElementById("ws"),wc=document.getElementById("wc"),md=document.getElementById("md");
 G.usedModel=false;md.addEventListener("toggle",()=>{if(md.open)G.usedModel=true});
 const prev=S.writes[it.id];if(prev)ta.value=prev.text;

 ws.onclick=()=>{if(G.done)return;const text=ta.value.trim();S.writes[it.id]={text,d:new Date().toLocaleDateString("id-ID")};ta.readOnly=true;ws.disabled=true;
  award(!G.usedModel,ELEM.write,G.usedModel?12:20);
  showNext("",`<div class="fb ok pop"><strong>Tulisan terkirim ke rapor! +${G.usedModel?12:20} XP</strong><span>Bandingkan tulisanmu dengan contoh teks di atas, lalu salin dan kirim ke guru untuk dinilai.</span><div class="row" style="margin-top:8px"><button class="btn ghost" id="cpw">Salin tulisanku</button></div></div>`);
  md.open=true;document.getElementById("cpw").onclick=e=>copyText(`${S.name?S.name+"\n":""}${W[G.wi].title}: ${it.task}\n\n${text}`,e.currentTarget);};
}

/* ---------- SCORING ---------- */
function award(first,e,pts){
 if(G.mode==="test")return;
 pts=pts||((first?10:5)*(G.mode==="boss"?1.5:1)|0);G.xp+=pts;S.xp+=pts;
 [G.el,S.el].forEach(o=>{o[e]=o[e]||{n:0,f:0};o[e].n++;if(first)o[e].f++});
 save();const xv=document.getElementById("xpv");if(xv)xv.textContent=S.xp;
}
function correct(note){award(G.errNow===0,ELEM[cur().t]);showNext(note)}
function showNext(note,html){
 G.done=true;clearTimer();
 if(G.mode==="review"&&G.itemErr===0)delete S.wrong[cur().id];save();
 const last=G.i===G.items.length-1;
 fb(`${html||`<div class="fb ok pop"><strong>Benar!</strong><span>${esc(note)}</span></div>`}<div class="row" style="margin-top:12px"><button class="btn" id="nx">${last?"Selesai":"Lanjut →"}</button></div>`);
 const nx=document.getElementById("nx");nx.focus({preventScroll:true});nx.onclick=()=>{if(last)finish();else{G.i++;step()}};
}
function updateStat(){const s=app.querySelector(".tk-h .stat");if(s)s.innerHTML=`${hearts()}<span>${G.i+1}/${G.items.length}</span>`}
function miss(h,timeout){
 G.err++;G.errNow++;G.itemErr++;S.wrong[cur().id]=1;save();
 if(G.maxLives){G.lives--;updateStat()}
 if(G.maxLives&&G.lives<=0){G.done=true;clearTimer();setTimeout(fail,1100);fb(`<div class="fb no"><strong>Nyawa habis.</strong><span>${esc(h)}</span></div>`);return}
 fb(`<div class="fb no shake"><strong>${timeout?"Waktu habis.":"Belum tepat, coba lagi."}${G.maxLives?` (sisa ${G.lives} nyawa)`:""}</strong><span>${esc(h)}</span></div>`);
}
function starsFor(err){return err<=1?3:err<=3?2:1}
function elemReport(){
 const rows=ELEMS.filter(e=>G.el[e]).map(e=>{const r=G.el[e],p=Math.round(r.f/r.n*100);
  return `<div class="elrow"><span>${e}</span><span class="elbar"><i style="width:${p}%"></i></span><b>${r.f}/${r.n}</b></div>`}).join("");
 return rows?`<div class="elbox"><span class="mono">Benar di percobaan pertama, per elemen CP</span>${rows}</div>`:"";
}
function finish(){
 clearTimer();const w=W[G.wi];
 if(G.mode==="test"){
  const list=S.tests[w.key]=S.tests[w.key]||[];list.push({s:G.correct,t:G.items.length,d:new Date().toLocaleDateString("id-ID")});save();
  const first=list[0],diff=G.correct-first.s,p=Math.round(G.correct/G.items.length*100);
  const before=placeOf(w),newPlace=Math.max(before,placementFor(G.correct));S.place[w.key]=newPlace;save();
  const advice=list.length===1?`Kamu langsung bisa mulai dari <b>Misi ${newPlace+1} · ${LEVELS[newPlace].name}</b>.${newPlace>0?" Misi di bawahnya tetap terbuka bila ingin mengulang dasar.":" Kuatkan dasarmu dulu, lalu naik level satu per satu."}`:newPlace>before?`Hasil ini membuka misi baru sampai <b>Misi ${newPlace+1} · ${LEVELS[newPlace].name}</b>.`:"Teruskan misi berikutnya untuk menaikkan kemampuanmu.";
  const lvRows=LEVELS.map((l,i)=>{const r=(G.byLv||{})[i]||[0,0];return r[1]?`<tr><td>${i+1}. ${l.name}</td><td>${l.grade}</td><td>${r[0]}/${r[1]}</td></tr>`:""}).join("");
  app.innerHTML=`${topbar(w.title)}<section class="result pop"><span class="mono">${esc(w.title)} · Tes Kemampuan ${list.length===1?"Awal":"ke-"+list.length}</span>
  <h1>${G.correct}/${G.items.length}</h1><p style="margin:0;font-size:20px;font-weight:700">Skor ${p}</p>
  ${list.length>1?`<p class="badge">${diff>0?`📈 Naik ${diff} poin dari tes awal`:diff===0?"Sama dengan tes awal":`Turun ${-diff} poin dari tes awal`}</p>`:""}
  <p style="margin:0;max-width:46ch">${advice}</p>
  <div class="tblw" style="max-width:420px;width:100%"><table><tr><th>Level</th><th>Setara</th><th>Benar</th></tr>${lvRows}</table></div>
  <div class="row" style="justify-content:center"><button class="btn" id="mp">Ke peta misi</button></div></section>`;
  document.getElementById("bk").onclick=()=>world(G.wi);document.getElementById("mp").onclick=()=>world(G.wi);window.scrollTo(0,0);return;
 }
 if(G.mode==="review"){
  const left=reviewIds(w).length;
  app.innerHTML=`${topbar(w.title)}<section class="result pop"><span class="mono">${esc(w.title)} · Latihan Ulang</span><h1>Latihan Selesai</h1>
  <p style="margin:0">+${G.xp} XP · ${left?`Masih ada ${left} soal di daftar Latihan Ulang.`:"Daftar Latihan Ulang sudah kosong. Hebat!"}</p>${elemReport()}
  <div class="row" style="justify-content:center">${left?`<button class="btn" id="rp">Latihan lagi</button>`:""}<button class="btn ghost" id="mp">Peta misi</button></div></section>`;
  document.getElementById("bk").onclick=()=>world(G.wi);document.getElementById("mp").onclick=()=>world(G.wi);
  if(left)document.getElementById("rp").onclick=()=>play(G.wi,"review");window.scrollTo(0,0);return;
 }
 const boss=G.mode==="boss",k=w.key+"-"+(boss?"boss":G.mi),s=starsFor(G.err);
 const firstClear=!S.done[k],bonus=firstClear?(boss?60:20):0;S.xp+=bonus;S.done[k]=Math.max(s,S.done[k]||0);save();
 const last=w.missions.length-1,nextOpen=!boss&&G.mi<last&&unlocked(w,G.mi+1),bossNow=!boss&&G.mi===last&&bossOpen(w);
 const msg=s===3?"Sempurna! Kamu bekerja seperti profesional.":s===2?"Bagus! Misi berikutnya sudah terbuka. Ulangi untuk meraih 3 bintang.":"Misi selesai, tetapi perlu minimal 2 bintang untuk membuka misi berikutnya. Kerjakan Latihan Ulang, lalu coba lagi.";
 app.innerHTML=`${topbar(w.title)}
 <section class="result pop"><span class="mono">${esc(w.title)} · ${boss?"Boss Mission":`Misi ${G.mi+1} · ${LEVELS[G.mi].name}`}</span>
 <h1>${boss?"Lulus Ujian Kerja":"Misi Selesai"}</h1><div class="stars" aria-label="${s} dari 3 bintang">${"★".repeat(s)}<span class="off">${"★".repeat(3-s)}</span></div>
 <p style="margin:0">+${G.xp+bonus} XP${bonus?` (termasuk bonus pertama kali +${bonus})`:""} · Kesalahan: ${G.err}</p>
 <p class="muted" style="margin:0;max-width:46ch">${msg}</p>${elemReport()}
 ${boss?`<span class="badge">🏅 Sertifikat ${esc(w.title)} · ${esc(w.dept)}</span><p class="muted" style="margin:0">Sekarang kerjakan Tes Kemampuan lagi untuk melihat peningkatanmu.</p>`:""}
 <div class="row" style="justify-content:center">${nextOpen?`<button class="btn" id="nm">Misi berikutnya →</button>`:""}${bossNow?`<button class="btn" id="nb">⚔️ Boss Mission</button>`:""}<button class="btn ghost" id="rp">Main lagi</button><button class="btn ghost" id="mp">Peta misi</button></div></section>`;
 wire(nextOpen,bossNow);
}
function fail(){
 const w=W[G.wi];
 app.innerHTML=`${topbar(w.title)}
 <section class="result fail pop"><span class="mono">${esc(w.title)} · ${G.mode==="boss"?"Boss Mission":`Misi ${G.mi+1} · ${LEVELS[G.mi].name}`}</span>
 <h1>Misi Gagal</h1><p style="margin:0;font-size:40px">💔</p>
 <p style="margin:0">Kamu menyelesaikan ${G.i} dari ${G.items.length} soal · XP tetap tersimpan: +${G.xp}</p>
 <p class="muted" style="margin:0;max-width:46ch">Nyawamu habis. Soal yang salah sudah masuk Latihan Ulang. Kerjakan latihan itu dulu, lalu coba misi ini lagi.</p>
 <div class="row" style="justify-content:center"><button class="btn" id="rp">Coba lagi</button><button class="btn ghost" id="rv">Latihan Ulang</button><button class="btn ghost" id="mp">Peta misi</button></div></section>`;
 wire(false,false);document.getElementById("rv").onclick=()=>play(G.wi,"review");
}
function wire(nextOpen,bossNow){
 document.getElementById("bk").onclick=()=>world(G.wi);
 if(nextOpen)document.getElementById("nm").onclick=()=>play(G.wi,"mission",G.mi+1);
 if(bossNow)document.getElementById("nb").onclick=()=>play(G.wi,"boss");
 document.getElementById("rp").onclick=()=>G.mode==="boss"?play(G.wi,"boss"):play(G.wi,"mission",G.mi);
 document.getElementById("mp").onclick=()=>world(G.wi);
 window.scrollTo(0,0);
}
if(canSpeak)try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
home();

</script>
